name: Ragnar - verificar publicacion Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validar archivos listos para publicar
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/logo.png
          test -d dist/assets
          grep -q '/assets/' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
