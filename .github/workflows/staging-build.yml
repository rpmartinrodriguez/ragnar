name: Ragnar - verificar staging con Firebase nuevo

on:
  push:
    branches:
      - staging/ragnar-5f8d7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --prefix netlify/functions --no-package-lock --no-audit --no-fund
      - run: node --input-type=module -e "await import('./netlify/functions/reset-student-password.mjs')"
      - run: npm run build
      - run: node --check scripts/migration/import-backup.mjs
      - run: node --check scripts/migration/create-student-auth.mjs
      - run: node --check netlify/functions/reset-student-password.mjs
      - run: node --check netlify/functions/ragnar-push.mjs
      - run: node --input-type=module -e "await import('./netlify/functions/ragnar-push.mjs')"
      - name: Validar archivos para Netlify
        run: |
          test -f dist/index.html
          test -f dist/importar.html
          test -f dist/firebase-messaging-sw.js
          test -f dist/manifest.json
          test -d dist/assets
          grep -q '/assets/' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
