<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="theme-color" content="#101012" />
    <script>
      /* Elegir tema antes de React evita un destello oscuro en modo claro. */
      (() => {
        try {
          const stored = localStorage.getItem('ragnar.appearance.v1');
          const mode = ['dark', 'light', 'system'].includes(stored) ? stored : 'system';
          const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)')?.matches ?? true;
          const theme = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode;
          document.documentElement.dataset.ragnarTheme = theme;
          document.documentElement.dataset.ragnarAppearance = mode;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content',
            theme === 'light' ? '#f6f5ef' : '#101012');
        } catch {}
      })();
    </script>
    <style>
      html[data-ragnar-theme="light"], html[data-ragnar-theme="light"] body {
        background: #f6f5ef;
      }
    </style>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>RAGNAR-TRAINING</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
